# LYAdmin 反向代理示例（生产部署：nginx 托管前端产物 + 反代后端）
#
# 与 deploy/docker-compose.yml 配合使用：
#   - api 容器监听 3000，compose 内部域名是 `api`；
#   - 前端产物挂到 nginx 的 /usr/share/nginx/html（即 ly-admin-web/dist）；
#   - 也可直接只用 api 容器（它是同源托管前端 + history 回退的），nginx 仅做 TLS 卸载。
#
# ⚠️ /static/ 必须**反代**给 api，不要把 uploads 目录直接映射成 nginx 静态目录：
# 那样会绕过防盗链与 ?scale= 缩放（这两件事都在 api 里做）。

server {
    listen       80;
    server_name  _;

    # 与后端 UPLOAD_MAX_SIZE（默认 10MB）保持一致，否则大文件会被 nginx 先拦成 413，
    # 后端根本收不到请求，前端只会看到一个没有业务错误码的 413。
    client_max_body_size 10m;

    # 与后端 User-Agent / IP 记录口径一致
    charset utf-8;

    # 构建产物已由 vite-plugin-compression2 生成 .br/.gz，这里只需对动态响应兜底压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml image/svg+xml application/wasm;

    # 后端已下发 nosniff / X-Frame-Options / Referrer-Policy，SPA 由 nginx 直出故这里补一份
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root  /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的产物：一年长缓存（文件名变了才会变 URL）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 接口：保留原始 Host / 客户端 IP，后端 TRUST_PROXY=1 时才认 X-Forwarded-For
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传资源：反代给后端（防盗链 + 按需缩放都在后端）
    location /static/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端 history 回退：index.html 不缓存（否则发版后用户拿到旧壳）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# HTTPS（生产建议启用；启用后把上面的 80 端口块改为 301 跳转，并在 api 侧设 SECURITY_HSTS=1）
