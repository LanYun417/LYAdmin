# LYAdmin 同源部署的 Nginx 站点模板（反代到后端 4700，按实际端口调整）。
#
# 使用方式：把本文件并入站点 server 块（宝塔面板即「网站 → 反代理/配置文件」），
# 或整段作为 server 块使用。上线前必须核对三处：
#   1. server_name 与证书路径；
#   2. proxy_pass 端口与 ly-admin-api/.env 的 PORT 一致；
#   3. 下面「⚠️ 踩坑记录」里的缓存项——SPA 项目开反代缓存会出页面 404。
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/cert/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/admin.example.com/privkey.pem;

    # 真实 IP：反代后 req.ip 全是 127.0.0.1，限流/审计/IP 规则会全部失效。
    # 与后端 TRUST_PROXY 配合：此处跳数设为 1，后端 .env 里 TRUST_PROXY=1。
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 0; # 大文件分片上传：单文件上限由后端控制，Nginx 不再拦

    # ------------------------- API：禁用一切代理缓存 -------------------------
    # 全局 include 的 proxy.conf（宝塔默认）会打开 proxy_cache，把带用户态的
    # JSON 响应缓存约 1 小时——表现为「接口返回别人的数据」。API 一律直连。
    location /api/ {
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------ SSE：长连接，禁用缓冲 ------------------------
    # 压缩器会攒缓冲再吐，直接破坏实时性（表现为「连上了但收不到帧」）。
    location /api/sse/ {
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_cache off;
    }

    # ------------------- 页面与静态资源：同样禁用代理缓存 -------------------
    # ⚠️ 踩坑记录（2026-11-24 线上事故）：宝塔全局 proxy.conf 默认开启 proxy_cache，
    # SPA 的 index.html 与 Brotli/Gzip 压缩变体被按 URL 缓存，快速刷新时浏览器
    # 拿到「另一压缩算法压缩的响应体」，页面直接 404。HTML 必须每次回上游校验；
    # hashed 静态资源的长期缓存由浏览器负责（后端已下发 immutable），不依赖代理缓存。
    location / {
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}