<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="LYAdmin 蓝云后台管理系统">
  <defs>
    <linearGradient id="lyAdminLogoIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#409EFF"/>
      <stop offset="100%" stop-color="#36CFC9"/>
    </linearGradient>
    <linearGradient id="lyAdminLogoText" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="537" y2="0">
      <stop offset="0%" stop-color="#409EFF"/>
      <stop offset="100%" stop-color="#36CFC9"/>
    </linearGradient>
  </defs>
  <!-- 图标底：100×100，垂直居中 -->
  <rect x="50" y="50" width="100" height="100" rx="28" fill="url(#lyAdminLogoIcon)"/>
  <!-- 图标内 L/Y -->
  <text
    x="100"
    y="100"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Courier', 'Courier New', monospace"
    font-size="56"
    font-weight="bold"
    fill="#fff"
    letter-spacing="-2"
  >LY</text>
  <!-- 中文名：渐变 -->
  <text
    x="180"
    y="90"
    font-family="'Poppins', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="40"
    font-weight="800"
    fill="url(#lyAdminLogoText)"
    letter-spacing="1"
  >蓝云后台管理系统</text>
  <!-- 英文名 -->
  <text
    x="180"
    y="137"
    font-family="'KaiTi', 'STKaiti', '楷体', 'Kaiti SC', serif"
    font-size="22"
    font-weight="600"
    fill="#409EFF"
    textLength="327"
    lengthAdjust="spacing"
  >LY-ADMIN</text>
</svg>